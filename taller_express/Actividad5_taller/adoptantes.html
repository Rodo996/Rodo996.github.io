<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adoptantes - Buscando Huellas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .header {
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .contenedor-adoptantes {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .tarjeta {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 80%;
            max-width: 500px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Nuestros Adoptantes</h1>
        <p>Conoce a las personas que están buscando a su nuevo mejor amigo.</p>
    </div>

    <main class="contenedor-adoptantes">
        <div class="tarjeta">
            <h2>María López</h2>
            <p><strong>Busca:</strong> Un perrito de tamaño pequeño.</p>
            <p><strong>Ubicación:</strong> Zapopan</p>
        </div>

        <div class="tarjeta">
            <h2>Carlos Hernández</h2>
            <p><strong>Busca:</strong> Un perro activo para salir a correr.</p>
            <p><strong>Ubicación:</strong> Guadalajara</p>
        </div>
    </main>

</body>
</html>
